<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>売上記録（Bar KAMAKURA）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f3f2ef;
    --surface-3: #eae9e4;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8975;
    --accent: #2a78d6;
    --accent-soft: #eaf1fb;
    --danger: #e34948;
    --danger-soft: #fbeceb;
    --good: #1baf7a;
    --good-soft: #e6f7f0;
    --border: #e4e3dd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--surface-1); color: var(--text-primary); }
  .app { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; }
  .sync-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; padding: 6px 10px; background: var(--surface-2); border-radius: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .sync-dot.syncing { background: var(--accent); }
  .sync-dot.error { background: var(--danger); }

  .panel { background: var(--surface-2); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  input[type=date], input[type=month], input[type=number], input[type=text], select {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px;
  }
  .choice-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice-btn {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-primary);
  }
  .choice-btn.selected { background: var(--accent); color: white; border-color: var(--accent); }

  .stats-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-tile { background: var(--surface-2); border-radius: 8px; padding: 8px 14px; font-size: 12px; }
  .stat-tile b { font-size: 16px; }

  .rec-row {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    background: var(--surface-2); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
  }
  .rec-main { display: flex; flex-direction: column; gap: 2px; }
  .rec-table { font-size: 15px; font-weight: 700; }
  .rec-sub { font-size: 12px; color: var(--text-secondary); }
  .rec-amount { font-size: 17px; font-weight: 700; color: var(--accent); }
  .pay-tag { font-size: 11px; background: var(--good-soft); color: var(--good); padding: 2px 8px; border-radius: 5px; font-weight: 600; }
  .day-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .biz-tag { font-size: 11px; background: #fff1d6; color: #8a5a1c; padding: 2px 8px; border-radius: 5px; font-weight: 700; margin-right: 6px; }

  button.btn-primary { background: var(--accent); color: white; cursor: pointer; font-size: 13px; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 600; }
  button.btn-ghost { background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border); cursor: pointer; font-size: 12px; border-radius: 8px; padding: 8px 12px; }
  button.btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger); cursor: pointer; font-size: 12px; border-radius: 8px; padding: 8px 12px; }
  .empty-msg { color: var(--text-muted); font-size: 13px; padding: 24px 0; text-align: center; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal-box { background: var(--surface-1); border-radius: 12px; padding: 22px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-box h3 { margin: 0 0 4px; font-size: 17px; }
  .modal-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.8; }
  .modal-meta b { color: var(--text-primary); }
  .detail-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px;
  }
  .detail-row.cancelled .d-name, .detail-row.cancelled .d-price { text-decoration: line-through; color: var(--danger); opacity: 0.7; }
  .d-info { display: flex; flex-direction: column; }
  .d-mods { font-size: 11px; color: var(--text-muted); }
  .d-time { font-size: 10px; color: var(--text-muted); }
  .total-box { background: var(--surface-3); border-radius: 10px; padding: 12px 16px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
  .total-box .amount { font-size: 20px; font-weight: 800; color: var(--accent); }
</style>
</head>
<body>
<script>

try { if (localStorage.getItem("bk_unlocked") !== "1") location.replace("index.html"); } catch (e) {}

<div class="app">
  <h1>売上記録（Bar KAMAKURA）</h1>
  <p class="subtitle">お会計済の伝票を自動で記録します(半永久保存・明細つき)</p>
  <div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">読み込み中...</span> <button class="btn-ghost" id="refresh-btn" style="margin-left:8px;">🔄 更新</button></div>
  <div style="margin-bottom:14px; display:flex; gap:8px; flex-wrap:wrap;">
    <button class="btn-ghost" id="show-trash-btn">🗑 消去フォルダを見る</button>
  </div>

  <div class="panel">
    <label>絞り込み期間</label>
    <div class="choice-row" id="period-mode-row" style="margin-bottom:12px;">
      <div class="choice-btn selected" data-mode="day">日別</div>
      <div class="choice-btn" data-mode="month">月別</div>
      <div class="choice-btn" data-mode="year">年別</div>
      <div class="choice-btn" data-mode="all">すべて</div>
    </div>
    <div class="filter-row">
      <div id="period-input-wrap">
        <label id="period-input-label">日付</label>
        <input type="date" id="filter-day">
      </div>
      <div>
        <label>卓</label>
        <select id="filter-table"><option value="">すべて</option></select>
      </div>
      <div>
        <label>支払方法</label>
        <select id="filter-pay">
          <option value="">すべて</option>
          <option value="現金">現金</option>
          <option value="カード">カード</option>
          <option value="ペイペイ">ペイペイ</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div><button class="btn-ghost" id="filter-clear">クリア</button></div>
    </div>
  </div>

  <div class="stats-row" id="stats"></div>

  <div id="rec-list"></div>
</div>

<div id="detail-modal"></div>

<script>
const BIN_ID = "6a843737da38895dfef24f99";
const API_KEY = "$2a$10$jiwjfT19MDnJjirDWpn/3.ifgrcNeVrTA46lGgVe65q5zzQzdS3ya";
const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const CHARGE_PER_PERSON = 500;
// ---- 営業日の区切り ----
// 「9月1日」は 9月1日 17:00 〜 9月2日 16:59 のこと。
// 17時より前のお会計は、前の日の売上として数えます。
// 区切りの時刻を変えたいときはこの数字を書き換えてください。
const DAY_START_HOUR = 17;

let fullRecord = {};
let allSlips = [];
let deletedSlips = [];
let loaded = false;
let periodMode = "day";
let showingTrash = false;

function setSync(state, text) {
  const dot = document.getElementById("sync-dot");
  const label = document.getElementById("sync-text");
  dot.className = "sync-dot" + (state ? " " + state : "");
  label.textContent = text;
}

async function loadData() {
  setSync("syncing", "読み込み中...");
  try {
    const res = await fetch(`${BASE_URL}/latest`, { headers: { "X-Master-Key": API_KEY } });
    if (!res.ok) throw new Error("load failed");
    const json = await res.json();
    fullRecord = json.record || {};
    allSlips = (fullRecord.slips || []).filter(s => s.status === "paid");
    deletedSlips = fullRecord.deletedSlips || [];
    loaded = true;
    setSync("", "同期済み(全員で共有中)");
  } catch (e) {
    setSync("error", "読み込みエラー、時間をおいて再読み込みしてください");
  }
  populateTableFilter();
  render();
}

async function saveData() {
  setSync("syncing", "保存中...");
  try {
    const res0 = await fetch(`${BASE_URL}/latest`, { headers: { "X-Master-Key": API_KEY } });
    if (!res0.ok) throw new Error("reload failed");
    fullRecord = (await res0.json()).record || {};
    fullRecord.slips = [...(fullRecord.slips || []).filter(s => s.status !== "paid"), ...allSlips];
    fullRecord.deletedSlips = deletedSlips;
    const res = await fetch(BASE_URL, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY }, body: JSON.stringify(fullRecord) });
    if (!res.ok) throw new Error("save failed");
    setSync("", "同期済み(全員で共有中)");
  } catch (e) {
    setSync("error", "保存エラー、通信状況を確認してください");
  }
}

document.getElementById("refresh-btn").addEventListener("click", () => { loadData(); });

renderPeriodInput();

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function yen(n) { return "¥" + Math.round(n).toLocaleString(); }
function fmtDateTime(iso) {
  if (!iso) return "―";
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function itemExtra(item) { let extra = 0; if (item.mods && item.mods.mixer) extra += item.mods.mixer; return extra; }

// ---- 飲み放題プラン(伝票アプリと同じ計算) ----
const NOMI_PER_PERSON = 4000;
const NOMI_EXTEND_PER_PERSON = 2000;
function nomiPlan(slip) { return (slip && slip.nomihodai) ? slip.nomihodai : null; }
function chargeFor(slip) { return nomiPlan(slip) ? 0 : (slip.count || 0) * CHARGE_PER_PERSON; }
function nomiBaseFee(slip) { const n = nomiPlan(slip); return n ? n.count * NOMI_PER_PERSON : 0; }
function nomiExtendFee(slip) { const n = nomiPlan(slip); return n ? (n.extends || 0) * n.count * NOMI_EXTEND_PER_PERSON : 0; }
function nomiFee(slip) { return nomiBaseFee(slip) + nomiExtendFee(slip); }

function calcTotal(slip) {
  const itemsTotal = (slip.items || []).filter(i => !i.cancelled).reduce((s,i) => s + i.price + itemExtra(i), 0);
  return chargeFor(slip) + nomiFee(slip) + itemsTotal;
}

function populateTableFilter() {
  const tables = [...new Set(allSlips.map(s => s.table))].sort();
  const sel = document.getElementById("filter-table");
  sel.innerHTML = `<option value="">すべて</option>` + tables.map(t => `<option value="${t}">${t}</option>`).join("");
}

// ---- 期間モード切り替え ----
document.querySelectorAll("#period-mode-row .choice-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    periodMode = btn.dataset.mode;
    document.querySelectorAll("#period-mode-row .choice-btn").forEach(b => b.classList.toggle("selected", b === btn));
    renderPeriodInput();
    render();
  });
});
// ---- 営業日(17時区切り) ----
function businessDay(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1);
  return d;
}
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function ym(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
// 今の時点の営業日(17時より前なら前日)
function todayStr() {
  return ymd(businessDay(new Date().toISOString()));
}
// 「9/1(17時〜9/2 16:59)」のような説明文
// 一覧に出す「営業日 9/1」のタグ
function bizDayText(iso) {
  const d = businessDay(iso);
  return d ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}` : "―";
}
function bizTag(iso) {
  const d = businessDay(iso);
  return d ? `<span class="biz-tag">営業日 ${d.getMonth()+1}/${d.getDate()}</span> ` : "";
}
function businessDayLabel(dateStr) {
  const m = String(dateStr || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return "";
  const start = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), DAY_START_HOUR, 0, 0);
  const end = new Date(start.getTime() + 24 * 3600 * 1000 - 60000);
  const f = d => `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return `${f(start)} 〜 ${f(end)}`;
}
function renderPeriodInput() {
  const wrap = document.getElementById("period-input-wrap");
  if (periodMode === "day") {
    const t = todayStr();
    wrap.innerHTML = `<label>営業日(17時区切り)</label><input type="date" id="filter-day" value="${t}">
      <div class="day-hint" id="day-hint">${businessDayLabel(t)}</div>`;
  } else if (periodMode === "month") {
    wrap.innerHTML = `<label>月(17時区切りの営業日で集計)</label><input type="month" id="filter-day">`;
  } else if (periodMode === "year") {
    wrap.innerHTML = `<label>年(17時区切りの営業日で集計)</label><input type="number" id="filter-day" placeholder="例: 2026" min="2000" max="2100">`;
  } else {
    wrap.innerHTML = "";
  }
  const inp = document.getElementById("filter-day");
  if (inp) inp.addEventListener("input", () => {
    const hint = document.getElementById("day-hint");
    if (hint) hint.textContent = businessDayLabel(inp.value);
    render();
  });
}

function getFiltered() {
  const periodVal = document.getElementById("filter-day") ? document.getElementById("filter-day").value : "";
  const table = document.getElementById("filter-table").value;
  const pay = document.getElementById("filter-pay").value;
  return allSlips.filter(s => {
    if (periodVal) {
      // 17時区切りの営業日で判定する(9/2の深夜2時のお会計は9/1の売上)
      const d = businessDay(s.paidAt);
      if (!d) return false;
      if (periodMode === "day") {
        if (ymd(d) !== periodVal) return false;
      } else if (periodMode === "month") {
        if (ym(d) !== periodVal) return false;
      } else if (periodMode === "year") {
        if (String(d.getFullYear()) !== String(periodVal)) return false;
      }
    }
    if (table && s.table !== table) return false;
    if (pay && (!s.payment || s.payment.method !== pay)) return false;
    return true;
  }).sort((a,b) => new Date(b.paidAt || 0) - new Date(a.paidAt || 0));
}

document.getElementById("filter-table").addEventListener("change", render);
document.getElementById("filter-pay").addEventListener("change", render);
document.getElementById("filter-clear").addEventListener("click", () => {
  const inp = document.getElementById("filter-day");
  if (inp) inp.value = "";
  document.getElementById("filter-table").value = "";
  document.getElementById("filter-pay").value = "";
  render();
});

function render() {
  if (showingTrash) { renderTrash(); return; }
  const filtered = getFiltered();
  renderStats(filtered);
  renderList(filtered);
}

function renderStats(list) {
  const totalSales = list.reduce((s, slip) => s + calcTotal(slip), 0);
  const byMethod = (method) => list.filter(s => s.payment && s.payment.method === method).reduce((s, slip) => s + calcTotal(slip), 0);
  document.getElementById("stats").innerHTML = `
    <div class="stat-tile">記録件数 <b>${list.length}</b>件</div>
    <div class="stat-tile">売上合計 <b>${yen(totalSales)}</b></div>
    <div class="stat-tile">現金合計 <b>${yen(byMethod("現金"))}</b></div>
    <div class="stat-tile">カード合計 <b>${yen(byMethod("カード"))}</b></div>
    <div class="stat-tile">ペイペイ合計 <b>${yen(byMethod("ペイペイ"))}</b></div>
    <div class="stat-tile">その他合計 <b>${yen(byMethod("その他"))}</b></div>
  `;
}

function renderList(list) {
  const el = document.getElementById("rec-list");
  if (!loaded) { el.innerHTML = ""; return; }
  if (list.length === 0) { el.innerHTML = `<div class="empty-msg">まだ記録がありません(伝票アプリで「お会計済」にすると自動的にここに記録されます)</div>`; return; }
  el.innerHTML = list.map(s => `
    <div class="rec-row">
      <div class="rec-main">
        <span class="rec-table">${s.table} 卓 ・ ${escapeHtml(s.type || "")} ・ ${s.count}名</span>
        <span class="rec-sub">${bizTag(s.paidAt)}作成 ${fmtDateTime(s.createdAt)} ／ 会計 ${fmtDateTime(s.paidAt)}${s.payment ? ` <span class="pay-tag">${escapeHtml(s.payment.method)}${s.payment.note ? ':' + escapeHtml(s.payment.note) : ''}</span>` : ''}</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="rec-amount">${yen(calcTotal(s))}</span>
        <button class="btn-primary" onclick="showDetail(${s.id})">明細を出す</button>
        <button class="btn-danger-outline" onclick="openDeleteModal(${s.id})">消去</button>
      </div>
    </div>
  `).join("");
}

document.getElementById("show-trash-btn").addEventListener("click", () => {
  showingTrash = !showingTrash;
  document.getElementById("show-trash-btn").textContent = showingTrash ? "🗑 通常の記録に戻る" : "🗑 消去フォルダを見る";
  renderTrash();
});

function renderTrash() {
  const el = document.getElementById("rec-list");
  const statsEl = document.getElementById("stats");
  if (!showingTrash) { render(); return; }
  statsEl.innerHTML = `<div class="stat-tile">消去済み件数 <b>${deletedSlips.length}</b>件</div>`;
  if (deletedSlips.length === 0) { el.innerHTML = `<div class="empty-msg">消去フォルダには何もありません</div>`; return; }
  el.innerHTML = deletedSlips.slice().sort((a,b) => new Date(b.deletedAt||0) - new Date(a.deletedAt||0)).map(s => `
    <div class="rec-row">
      <div class="rec-main">
        <span class="rec-table">${s.table} 卓 ・ ${escapeHtml(s.type || "")} ・ ${s.count}名</span>
        <span class="rec-sub">会計 ${fmtDateTime(s.paidAt)} ／ 消去 ${fmtDateTime(s.deletedAt)}</span>
        <span class="rec-sub">消去理由: <b>${escapeHtml(s.deleteReason || "")}</b></span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="rec-amount">${yen(calcTotal(s))}</span>
        <button class="btn-primary" onclick="showDetail(${s.id}, true)">明細を出す</button>
      </div>
    </div>
  `).join("");
}

function openDeleteModal(slipId) {
  const slip = allSlips.find(s => s.id === slipId);
  if (!slip) return;
  const modal = document.getElementById("detail-modal");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="event.target===event.currentTarget && closeDetail()">
      <div class="modal-box">
        <h3>${slip.table} 卓 の記録を消去</h3>
        <div class="modal-meta">この記録は完全には消えず、「消去フォルダ」に移動されます。消去する理由を必ず入力してください。</div>
        <label>消去理由(必須)</label>
        <div style="margin-bottom:14px;"><input type="text" id="delete-reason-input" placeholder="例: 入力ミスで二重登録した"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn-ghost" onclick="closeDetail()">キャンセル</button>
          <button class="btn-primary" style="background:var(--danger)" onclick="confirmDeleteSlip(${slipId})">消去する</button>
        </div>
      </div>
    </div>
  `;
}

function confirmDeleteSlip(slipId) {
  const reason = document.getElementById("delete-reason-input").value.trim();
  if (!reason) { alert("消去理由を入力してください"); return; }
  const idx = allSlips.findIndex(s => s.id === slipId);
  if (idx === -1) return;
  const slip = allSlips[idx];
  slip.deletedAt = new Date().toISOString();
  slip.deleteReason = reason;
  deletedSlips.push(slip);
  allSlips.splice(idx, 1);
  closeDetail();
  populateTableFilter();
  render();
  saveData();
}

function showDetail(slipId, fromTrash) {
  const slip = (fromTrash ? deletedSlips : allSlips).find(s => s.id === slipId);
  if (!slip) return;
  const charge = chargeFor(slip);
  const nomi = nomiPlan(slip);
  const total = calcTotal(slip);
  const modal = document.getElementById("detail-modal");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="event.target===event.currentTarget && closeDetail()">
      <div class="modal-box">
        <h3>${slip.table} 卓 明細</h3>
        <div class="modal-meta">
          <b>${escapeHtml(slip.type || "")}</b> ・ <b>${slip.count}名</b>${slip.note ? " ・ " + escapeHtml(slip.note) : ""}<br>
          営業日: <b>${bizDayText(slip.paidAt)}</b>(17時区切り)<br>
          伝票作成: <b>${fmtDateTime(slip.createdAt)}</b><br>
          お会計: <b>${fmtDateTime(slip.paidAt)}</b><br>
          支払方法: <b>${slip.payment ? escapeHtml(slip.payment.method) + (slip.payment.note ? '(' + escapeHtml(slip.payment.note) + ')' : '') : '―'}</b>
        </div>
        ${nomi ? `
        <div class="detail-row">
          <div class="d-info"><span class="d-name">🍻 飲み放題(${nomi.count}名 × ${yen(NOMI_PER_PERSON)})</span><span class="d-mods">チャージなし${nomi.startAt ? ` ・ 開始 ${fmtTime(nomi.startAt)}` : ''}</span></div>
          <span class="d-price">${yen(nomiBaseFee(slip))}</span>
        </div>
        ${nomi.extends ? `
        <div class="detail-row">
          <div class="d-info"><span class="d-name">🍻 飲み放題 延長(${nomi.extends}時間 × ${nomi.count}名 × ${yen(NOMI_EXTEND_PER_PERSON)})</span></div>
          <span class="d-price">${yen(nomiExtendFee(slip))}</span>
        </div>` : ''}
        ` : `
        <div class="detail-row">
          <div class="d-info"><span class="d-name">チャージ(${slip.count}名 × ¥500)</span></div>
          <span class="d-price">${yen(charge)}</span>
        </div>`}
        ${(slip.items || []).map(i => {
          const mods = [];
          if (i.mods && (i.mods.mixer || i.mods.mixerName)) mods.push(i.mods.mixer ? `割材+${i.mods.mixer}${i.mods.mixerName ? `(${i.mods.mixerName})` : ""}` : `割材(${i.mods.mixerName})`);
          if (i.mods && i.mods.style) mods.push(i.mods.style);
          if (i.nomi) mods.push("飲み放題");
          return `
          <div class="detail-row ${i.cancelled ? 'cancelled' : ''}">
            <div class="d-info">
              <span class="d-name">${escapeHtml(i.name)}</span>
              ${mods.length ? `<span class="d-mods">${mods.join(" / ")}</span>` : ''}
              <span class="d-time">注文 ${fmtTime(i.orderedAt)}</span>
            </div>
            <span class="d-price">${yen(i.price + itemExtra(i))}</span>
          </div>
        `;
        }).join("")}
        <div class="total-box"><span>合計金額</span><span class="amount">${yen(total)}</span></div>
        <div style="margin-top:16px; text-align:right;"><button class="btn-ghost" onclick="closeDetail()">閉じる</button></div>
      </div>
    </div>
  `;
}
function closeDetail() { document.getElementById("detail-modal").innerHTML = ""; }

loadData();
</script>
</body>
</html>
