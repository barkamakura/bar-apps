<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bar KAMAKURA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar KAMAKURA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#b0e2f5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<style>
  :root {
    --surface-1: #fcfcfb;
    --surface-2: #f3f2ef;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --accent: #2a78d6;
    --border: #e4e3dd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--surface-1); color: var(--text-primary);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .switcher {
    display: flex; gap: 6px; padding: 10px 14px; background: var(--surface-2);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .switcher button {
    background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border);
    font-weight: 600; cursor: pointer; border-radius: 8px; padding: 10px 8px; font-size: 14px;
  }
  .switcher button[data-app="price"] { flex: 1 1 0; }
  .switcher button[data-app="slip"] { flex: 2 1 0; }
  .switcher button[data-app="records"] { flex: 1 1 0; }
  .switcher button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .frame-wrap { flex: 1; min-height: 0; position: relative; }
  .frame-wrap iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none;
  }
  .frame-wrap iframe.active { display: block; }

  /* ---- ロック画面 ---- */
  #lock {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(180deg, #cfeaf8 0%, #a9d9f0 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 18px;
  }
  #lock.hidden { display: none; }
  #lock img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  #lock .lock-title { font-size: 15px; font-weight: 600; color: #123; }
  .dots { display: flex; gap: 14px; height: 16px; }
  .dots span {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #2f5d73; background: transparent;
  }
  .dots span.on { background: #2f5d73; }
  .dots.shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-9px); }
    75% { transform: translateX(9px); }
  }
  .pad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px; }
  .pad button {
    height: 74px; border-radius: 50%; border: none; font-size: 26px; font-weight: 500;
    background: rgba(255,255,255,.75); color: #123; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pad button:active { background: rgba(255,255,255,1); }
  .pad button.wide { border-radius: 22px; font-size: 15px; background: transparent; }
  .lock-msg { font-size: 13px; color: #a8323a; height: 18px; font-weight: 600; }
</style>
</head>
<body>
  <div id="lock">
    <img src="icon-192.png" alt="Bar KAMAKURA">
    <div class="lock-title">暗証番号を入力してください</div>
    <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
    <div class="lock-msg" id="lock-msg"></div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <span></span><button data-k="0">0</button><button class="wide" data-k="del">消す</button>
    </div>
  </div>

  <div class="switcher">
    <button data-app="price" class="active">値段確認</button>
    <button data-app="slip">伝票</button>
    <button data-app="records">売上記録</button>
  </div>
  <div class="frame-wrap">
    <iframe id="frame-price" class="active" data-src="price.html"></iframe>
    <iframe id="frame-slip" data-src="slip.html"></iframe>
    <iframe id="frame-records" data-src="records.html"></iframe>
  </div>

<script>
// ---- 暗証番号ロック ----
// 番号そのものはコードに書かず、ハッシュ値だけを保存しています。
// 番号を変えたいときは、下の PIN_HASH を新しい番号のSHA-256値に差し替えてください。
const PIN_HASH = "a67ae99df04ecbdbbd885e266be5c7ffaba85d003ca5b9c9e7ac1c5699acb1ac";
const UNLOCK_KEY = "bk_unlocked";
let entry = "";

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function paintDots() {
  document.querySelectorAll("#dots span").forEach((s, i) => s.classList.toggle("on", i < entry.length));
}

function unlock() {
  try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
  document.getElementById("lock").classList.add("hidden");
  document.querySelectorAll(".frame-wrap iframe").forEach(f => {
    if (!f.src) f.src = f.dataset.src;
  });
}

async function pressKey(k) {
  const msg = document.getElementById("lock-msg");
  if (k === "del") { entry = entry.slice(0, -1); msg.textContent = ""; paintDots(); return; }
  if (entry.length >= 4) return;
  entry += k;
  paintDots();
  if (entry.length === 4) {
    const ok = (await sha256(entry)) === PIN_HASH;
    if (ok) {
      unlock();
    } else {
      const dots = document.getElementById("dots");
      dots.classList.add("shake");
      msg.textContent = "番号が違います";
      setTimeout(() => { dots.classList.remove("shake"); entry = ""; paintDots(); }, 420);
    }
  }
}

document.getElementById("pad").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) pressKey(b.dataset.k);
});

try {
  if (localStorage.getItem(UNLOCK_KEY) === "1") unlock();
} catch (e) {}

// ---- タブ切り替え ----
document.querySelectorAll(".switcher button").forEach(btn => {
  btn.addEventListener("click", () => {
    const app = btn.dataset.app;
    document.querySelectorAll(".switcher button").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".frame-wrap iframe").forEach(f => f.classList.remove("active"));
    document.getElementById("frame-" + app).classList.add("active");
  });
});

// ---- オフライン対応 ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
