<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bar KAMAKURA 伝票アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f3f2ef;
    --surface-3: #eae9e4;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8975;
    --accent: #2a78d6;
    --accent-soft: #eaf1fb;
    --danger: #e34948;
    --danger-soft: #fbeceb;
    --good: #1baf7a;
    --good-soft: #e6f7f0;
    --border: #e4e3dd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--surface-1); color: var(--text-primary); }
  .app { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; }
  .sync-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; padding: 6px 10px; background: var(--surface-2); border-radius: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .sync-dot.syncing { background: var(--accent); }
  .sync-dot.error { background: var(--danger); }

  .panel { background: var(--surface-2); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }

  /* 卓グリッド */
  .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .table-btn {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 10px; cursor: pointer; text-align: center; font-weight: 600; font-size: 15px;
  }
  .table-btn .t-sub { display: block; font-size: 11px; font-weight: 400; color: var(--text-muted); margin-top: 4px; }
  .table-btn.occupied { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* 汎用選択ボタン群 */
  .choice-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .choice-btn {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-primary);
  }
  .choice-btn.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .choice-btn.selected.mod { background: var(--good); border-color: var(--good); }
  label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px;
  }
  button.btn-primary { background: var(--accent); color: white; cursor: pointer; font-size: 14px; border: none; border-radius: 8px; padding: 11px 20px; font-weight: 600; }
  button.btn-primary:hover { opacity: 0.9; }
  button.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.btn-ghost { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); cursor: pointer; font-size: 13px; border-radius: 8px; padding: 9px 14px; }
  button.btn-ghost.active { background: var(--accent); color: white; border-color: var(--accent); }
  button.btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger); cursor: pointer; font-size: 12px; border-radius: 8px; padding: 5px 10px; }
  button.btn-paid { background: var(--good); color: white; border: none; border-radius: 8px; padding: 11px 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button.btn-paid:disabled { opacity: 0.7; cursor: default; }
  .item-tile.custom-tile { border-style: dashed; color: var(--text-secondary); text-align: center; }
  .pay-box { background: var(--surface-3); border-radius: 10px; padding: 16px 18px; margin-top: 18px; }
  .pay-box h3 { font-size: 13px; margin: 0 0 10px; }

  /* 伝票エディタ */
  .slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .slip-title { font-size: 20px; font-weight: 700; }
  .slip-meta { font-size: 12px; color: var(--text-secondary); }
  .slip-meta b { color: var(--text-primary); }
  .paid-badge { background: var(--good-soft); color: var(--good); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 6px; }

  .total-box { background: var(--surface-3); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .total-box .label { font-size: 13px; color: var(--text-secondary); }
  .total-box .amount { font-size: 26px; font-weight: 800; color: var(--accent); }

  .item-tab-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .item-tab-row button { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); font-weight: 500; cursor: pointer; border-radius: 8px; padding: 8px 14px; font-size: 13px; }
  .item-tab-row button.active { background: var(--accent); color: white; border-color: var(--accent); }

  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .item-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; cursor: pointer; text-align: left; font-size: 12px;
  }
  .item-tile b { display: block; font-size: 13px; margin-bottom: 2px; }
  .item-tile:disabled { opacity: 0.4; cursor: not-allowed; }

  .order-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px;
  }
  .order-row.cancelled .o-name, .order-row.cancelled .o-price { text-decoration: line-through; color: var(--danger); opacity: 0.7; }
  .o-info { display: flex; flex-direction: column; }
  .o-mods { font-size: 11px; color: var(--text-muted); }
  .empty-msg { color: var(--text-muted); font-size: 13px; padding: 16px 0; text-align: center; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal-box { background: var(--surface-1); border-radius: 12px; padding: 20px; max-width: 380px; width: 100%; }
  .modal-box h3 { margin: 0 0 14px; font-size: 15px; }

  /* ショットの数量選び */
  .qty-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
  }
  .qty-row.picked { background: var(--accent-soft); border: 1px solid var(--accent); }
  .qty-info { display: flex; flex-direction: column; }
  .qty-name { font-size: 13px; font-weight: 600; }
  .qty-price { font-size: 11px; color: var(--text-muted); }
  .qty-ctrl { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .qty-ctrl button {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 20px; line-height: 1;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .qty-ctrl button:disabled { opacity: 0.35; cursor: default; }
  .qty-ctrl .qty-num { min-width: 26px; text-align: center; font-size: 16px; font-weight: 700; }

  /* 未提供の注文 */
  .pending-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #fff6e5; border: 1px solid #e8b657; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .pending-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pending-table { font-size: 15px; font-weight: 700; }
  .pending-name { font-size: 13px; }
  .pending-sub { font-size: 11px; color: var(--text-muted); }
  .btn-serve {
    background: #e8940c; color: #fff; border: none; border-radius: 8px;
    padding: 11px 18px; font-size: 14px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-serve:active { opacity: .85; }
  .served-tag { font-size: 11px; color: var(--good); font-weight: 600; }
  .order-row.pending { background: #fff6e5; border: 1px solid #e8b657; }
  .pending-head { font-size: 13px; margin: 4px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--border); }
  .pending-head.drink { color: #1c5a86; border-bottom-color: #1c5a86; }
  .pending-head.food { color: #8a5a1c; border-bottom-color: #8a5a1c; margin-top: 18px; }

  /* 追加したときの合図 */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
    background: rgba(20,16,10,.94); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 600; z-index: 999; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .item-tile.staged { background: var(--accent-soft); border-color: var(--accent); }

  /* 他の卓へ切り替えるボタン */
  .table-switch {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
  }
  .tsw-label { font-size: 11px; color: var(--text-muted); margin-right: 4px; }
  .tsw-btn {
    position: relative; min-width: 54px; padding: 10px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    font-size: 15px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .tsw-btn:active { opacity: .7; }
  .tsw-btn.occupied { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tsw-btn .tsw-sub { display: block; font-size: 10px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
  .tsw-btn.occupied .tsw-sub { color: var(--accent); }
  .tsw-badge {
    position: absolute; top: -6px; right: -6px; background: #e8940c; color: #fff;
    border-radius: 999px; font-size: 10px; font-weight: 700; padding: 1px 6px;
  }

  /* 飲み放題プラン */
  .nomi-panel { border: 2px solid #e8940c; background: #fffaf0; }
  .nomi-panel h2 { color: #a1620a; }
  .nomi-note { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  .nomi-warn { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; margin: 10px 0; }
  .choice-btn.plan-nomi { border-color: #e8940c; color: #a1620a; font-weight: 700; }
  .choice-btn.plan-nomi.selected { background: #e8940c; border-color: #e8940c; color: #fff; }
  .nomi-fee-line { font-size: 13px; line-height: 1.8; background: var(--surface-1); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .nomi-time { border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .nomi-time-idle { background: var(--surface-3); }
  .nomi-time-ok { background: var(--good-soft); border: 1px solid var(--good); }
  .nomi-time-lo { background: #fff6e5; border: 1px solid #e8b657; }
  .nomi-time-over { background: var(--danger-soft); border: 1px solid var(--danger); }
  .nomi-time-main { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .nomi-time-sub { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
  .nomi-tag { font-size: 11px; font-weight: 700; color: #a1620a; background: #ffeccc; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .t-sub .nomi-mark { color: #a1620a; font-weight: 700; }
  .tile-badge {
    display: inline-block; background: var(--accent); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; padding: 1px 7px; margin-left: 6px;
  }
</style>
</head>

<script>
// ---- shared jsonbin.io backend ----
const BIN_ID = "6a843737da38895dfef24f99";
const API_KEY = "$2a$10$jiwjfT19MDnJjirDWpn/3.ifgrcNeVrTA46lGgVe65q5zzQzdS3ya";
const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

const TABLES = ["C1","C2","C3","C4","C5","C6","T1","T2","T3","T4"];
const CHARGE_PER_PERSON = 500;
const DISH_CATEGORIES = ["おつまみ","料理"];
// このジャンルは割材も飲み方もないので、タップしたらそのまま追加する
const NO_MODS_CATEGORIES = ["ビール","ワイン","日本酒","ソフトドリンク","ホットドリンク"];
const LIQUOR_CATEGORIES = ["ウイスキー(Bourbon)","ウイスキー(Japanese)","ウイスキー(Scotch その他)","ジン","ウォッカ","ラム","テキーラ","ブランデー","ベルモット","焼酎","日本酒","リキュール","ビール","ワイン","その他","ノンアルコール","ソフトドリンク","ホットドリンク","シャンパン"];
const BOTTLE_CATEGORIES = ["ワイン","シャンパン","その他"];
const COCKTAIL_PRICE_OPTIONS = [800,900,1000,1100,1200,1300,1400,1500];

// ---- 飲み放題プラン ----
const NOMI_PER_PERSON = 4000;          // 1人あたりの飲み放題料金(2時間)
const NOMI_EXTEND_PER_PERSON = 2000;   // 延長1時間あたり1人の料金
const NOMI_MIN_PEOPLE = 8;   // これ以上の人数でだけ飲み放題を選べる(上限なし)
const NOMI_PRICE_LIMIT = 700;          // 飲み放題で頼めるお酒の上限(税込)
const NOMI_MIXER_EXTRA = 100;          // 飲み放題で使える割材は「＋100円」のものだけ
const NOMI_PLAN_MINUTES = 120;         // 基本は2時間
const NOMI_EXTEND_MINUTES = 60;        // 延長1回で1時間
const NOMI_LO_BEFORE_END = 30;         // ラストオーダーは終了の30分前(開始1時間半後)
const NOMI_ORDER_STOP_BEFORE_END = 20; // 実際に注文を止めるのは終了の20分前(開始1時間40分後)

// 五十音順の並べ替え用(ひらがな・カタカナを同じ扱いにし、数字も自然な順に)
const JA_COLLATOR = new Intl.Collator("ja", { numeric: true, sensitivity: "base" });
function itemPrice(i) { return (i.cat === 'bottle' ? i.price : i.sellPrice) || 0; }
// まず値段の安い順、同じ値段どうしは五十音順(名前順)
function byPriceThenNameJa(a, b) {
  const d = itemPrice(a) - itemPrice(b);
  if (d !== 0) return d;
  return JA_COLLATOR.compare(a.name || "", b.name || "");
}

function groupByCategory(items, categoryOrder) {
  const groups = {};
  items.forEach(i => {
    const cat = i.category || "未分類";
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(i);
  });
  // ジャンルの中は「値段の安い順 → 同じ値段なら五十音順」に並べる
  Object.keys(groups).forEach(cat => groups[cat].sort(byPriceThenNameJa));
  const orderedCats = [...categoryOrder, ...Object.keys(groups).filter(c => !categoryOrder.includes(c))];
  return orderedCats.filter(c => groups[c]).map(c => ({ category: c, items: groups[c] }));
}

let fullRecord = {};
let menu = { dishes: [], liquors: [], bottles: [], shots: [] };
let slips = [];
let nextSlipId = 1;
let nextItemId = 1;
let loaded = false;

let currentTable = null;
let currentSlipId = null;
let newSlipDraft = { type: null, count: null };
let activeItemTab = "liquor";
let payUiOpen = false;
let payDraft = { method: null, note: "" };
let pickerOpen = false;
let pickerMode = "normal"; // "normal" = 通常の注文 / "nomi" = 飲み放題(0円)の注文
let stagedItems = [];

function setSync(state, text) {
  const dot = document.getElementById("sync-dot");
  const label = document.getElementById("sync-text");
  dot.className = "sync-dot" + (state ? " " + state : "");
  label.textContent = text;
}

async function loadData() {
  setSync("syncing", "読み込み中...");
  try {
    const res = await fetch(`${BASE_URL}/latest`, { headers: { "X-Master-Key": API_KEY } });
    if (!res.ok) throw new Error("load failed");
    const json = await res.json();
    fullRecord = json.record || {};
    menu = fullRecord.menuItems || { dishes: [], liquors: [], bottles: [] };
    if (!menu.shots) menu.shots = [];
    slips = fullRecord.slips || [];
    const slipIds = slips.map(s => s.id || 0);
    nextSlipId = (slipIds.length ? Math.max(...slipIds) : 0) + 1;
    const itemIds = slips.flatMap(s => (s.items||[]).map(i => i.id || 0));
    nextItemId = (itemIds.length ? Math.max(...itemIds) : 0) + 1;
    loaded = true;
    setSync("", "同期済み(全員で共有中)");
  } catch (e) {
    setSync("error", "読み込みエラー、時間をおいて再読み込みしてください");
  }
  renderTableGrid();
  if (currentSlipId) renderSlipView();
}

async function saveData() {
  setSync("syncing", "保存中...");
  try {
    const res0 = await fetch(`${BASE_URL}/latest`, { headers: { "X-Master-Key": API_KEY } });
    if (!res0.ok) throw new Error("reload failed");
    fullRecord = (await res0.json()).record || {};
    fullRecord.slips = slips;
    const res = await fetch(BASE_URL, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY }, body: JSON.stringify(fullRecord) });
    if (!res.ok) throw new Error("save failed");
    setSync("", "同期済み(全員で共有中)");
  } catch (e) {
    setSync("error", "保存エラー、通信状況を確認してください");
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function yen(n) { return "¥" + Math.round(n).toLocaleString(); }

function openSlipFor(table) {
  return slips.find(s => s.table === table && s.status === "open");
}

// ---- 画面切り替え ----
function showView(name) {
  document.getElementById("view-tables").style.display = name === "tables" ? "" : "none";
  document.getElementById("view-new").style.display = name === "new" ? "" : "none";
  document.getElementById("view-slip").style.display = name === "slip" ? "" : "none";
}

// ---- 卓グリッド ----
// ---- 提供の管理 ----
// served が undefined の注文(この機能より前に入れたもの)は「提供済み」として扱う
function isPending(i) { return i.served === false && !i.cancelled; }
// お酒・お酒(ボトル)・ショット・カクテルはドリンク、それ以外(おつまみ・料理)はフード
const DRINK_CATS = ["liquor", "bottle", "shot", "cocktail"];
function isDrinkItem(i) { return DRINK_CATS.includes(i.cat); }

function serveItem(slipId, itemId) {
  const slip = slips.find(s => s.id === slipId);
  if (!slip) return;
  const item = (slip.items || []).find(i => i.id === itemId);
  if (!item) return;
  item.served = true;
  item.servedAt = new Date().toISOString();
  renderPendingList();
  renderTableGrid();
  if (currentSlipId) renderSlipView();
  saveData();
}

function unserveItem(slipId, itemId) {
  const slip = slips.find(s => s.id === slipId);
  if (!slip) return;
  const item = (slip.items || []).find(i => i.id === itemId);
  if (!item) return;
  item.served = false;
  delete item.servedAt;
  renderPendingList();
  renderTableGrid();
  if (currentSlipId) renderSlipView();
  saveData();
}

function pendingOrders() {
  const out = [];
  slips.filter(s => s.status === "open").forEach(s => {
    (s.items || []).filter(isPending).forEach(i => out.push({ slip: s, item: i }));
  });
  // 受注順(古いものが上)
  out.sort((a, b) => new Date(a.item.orderedAt || 0) - new Date(b.item.orderedAt || 0));
  return out;
}

function waitedLabel(iso) {
  if (!iso) return "";
  const min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "たった今";
  if (min < 60) return `${min}分前`;
  return `${Math.floor(min / 60)}時間${min % 60}分前`;
}

function renderPendingList() {
  const el = document.getElementById("pending-list");
  if (!el) return;
  const list = pendingOrders();
  const head = document.querySelector("#pending-panel h2");
  if (head) head.textContent = `未提供の注文(受注順) ${list.length}件`;
  if (!loaded) { el.innerHTML = ""; return; }
  if (list.length === 0) { el.innerHTML = `<div class="empty-msg">未提供の注文はありません</div>`; return; }
  const row = ({ slip, item }) => {
    const mods = [];
    if (item.mods && (item.mods.mixer || item.mods.mixerName)) mods.push(mixerLabel(item.mods));
    if (item.mods && item.mods.style) mods.push(item.mods.style);
    if (item.nomi) mods.push("飲み放題");
    return `
      <div class="pending-row">
        <div class="pending-info">
          <span class="pending-table">${slip.table} 卓</span>
          <span class="pending-name">${escapeHtml(item.name)}${mods.length ? ` <span class="pending-sub">(${mods.join(" / ")})</span>` : ''}</span>
          <span class="pending-sub">${waitedLabel(item.orderedAt)}</span>
        </div>
        <button class="btn-serve" onclick="serveItem(${slip.id}, ${item.id})">提供</button>
      </div>
    `;
  };
  // バーなのでドリンクを先に出す
  const drinks = list.filter(x => isDrinkItem(x.item));
  const foods  = list.filter(x => !isDrinkItem(x.item));
  const block = (title, arr, cls) => `
    <h3 class="pending-head ${cls}">${title} ${arr.length}件</h3>
    ${arr.length === 0 ? '<div class="empty-msg" style="padding:8px 0;">なし</div>' : arr.map(row).join("")}
  `;
  el.innerHTML = block("🍸 ドリンク(お酒・ボトル・ショット・カクテル)", drinks, "drink")
              + block("🍽 おつまみ・料理", foods, "food");
}

function renderTableGrid() {
  renderPendingList();
  const grid = document.getElementById("table-grid");
  grid.innerHTML = TABLES.map(t => {
    const slip = openSlipFor(t);
    if (slip) {
      const total = calcTotal(slip);
      const pend = (slip.items || []).filter(isPending).length;
      const nt = nomiTiming(slip);
      const nomiMark = nomiPlan(slip)
        ? `<span class="nomi-mark">🍻飲み放題${nt ? (nt.remainMin > 0 ? ` 残${fmtMin(nt.remainMin)}` : " 時間超過") : " 未スタート"}</span><br>`
        : '';
      return `<div class="table-btn occupied" onclick="selectTable('${t}')">${t}<span class="t-sub">${nomiMark}対応中 ${yen(total)}${pend ? ` ・未提供${pend}` : ''}</span></div>`;
    }
    return `<div class="table-btn" onclick="selectTable('${t}')">${t}<span class="t-sub">空席</span></div>`;
  }).join("");
}

// ---- 他の卓へ移るボタン(今いる卓は出さない) ----
// 対応中の卓は色を変え、未提供の件数をバッジで出す
function renderTableSwitch(currentName) {
  const others = TABLES.filter(t => t !== currentName);
  return `
    <div class="table-switch">
      <span class="tsw-label">他の卓へ</span>
      ${others.map(t => {
        const os = openSlipFor(t);
        const pend = os ? (os.items || []).filter(isPending).length : 0;
        return `<button class="tsw-btn ${os ? 'occupied' : ''}" onclick="selectTable('${t}')">${t}
          <span class="tsw-sub">${os ? yen(calcTotal(os)) : '空席'}</span>
          ${pend ? `<span class="tsw-badge">${pend}</span>` : ''}
        </button>`;
      }).join("")}
    </div>
  `;
}

function selectTable(table) {
  currentTable = table;
  nomiSetupOpen = false;
  // 卓を移るときは、前の卓で開いていたお会計や品目の画面を閉じる
  payUiOpen = false;
  payDraft = { method: null, note: "" };
  closeItemPicker();
  closeModifierModal();
  const slip = openSlipFor(table);
  if (slip) {
    currentSlipId = slip.id;
    activeItemTab = "liquor";
    showView("slip");
    renderSlipView();
  } else {
    newSlipDraft = { type: null, count: null, plan: null, planPicked: false };
    document.getElementById("new-slip-title").textContent = "新規伝票 - " + table;
    document.querySelectorAll("#type-choice .choice-btn").forEach(b => b.classList.remove("selected"));
    document.querySelectorAll("#count-choice .choice-btn").forEach(b => b.classList.remove("selected"));
    document.getElementById("count-input-wrap").style.display = "none";
    document.getElementById("count-input").value = "";
    document.getElementById("note-input").value = "";
    document.getElementById("new-table-switch").innerHTML = renderTableSwitch(table);
    refreshPlanChoice();
    showView("new");
  }
}

document.getElementById("new-cancel-btn").addEventListener("click", () => {
  currentTable = null;
  showView("tables");
  renderTableGrid();
});

document.querySelectorAll("#type-choice .choice-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#type-choice .choice-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    newSlipDraft.type = btn.dataset.val;
    updateCreateBtn();
  });
});
document.querySelectorAll("#count-choice .choice-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#count-choice .choice-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    if (btn.dataset.val === "input") {
      document.getElementById("count-input-wrap").style.display = "";
      setDraftCount(null);
    } else {
      document.getElementById("count-input-wrap").style.display = "none";
      setDraftCount(parseInt(btn.dataset.val, 10));
    }
  });
});
document.getElementById("count-input").addEventListener("input", (e) => {
  const v = parseInt(e.target.value, 10);
  setDraftCount(v > 0 ? v : null);
});

// ---- プラン(通常 / 飲み放題)の選択 ----
// 人数が8名以上のときだけ選択欄を出す。人数を変えたら選び直してもらう。
function setDraftCount(n) {
  newSlipDraft.count = n;
  if (n && n >= NOMI_MIN_PEOPLE) {
    if (!newSlipDraft.planPicked) newSlipDraft.plan = null;
  } else {
    newSlipDraft.plan = "normal";
    newSlipDraft.planPicked = false;
  }
  refreshPlanChoice();
}
document.querySelectorAll("#plan-choice .choice-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    newSlipDraft.plan = btn.dataset.val;
    newSlipDraft.planPicked = true;
    refreshPlanChoice();
  });
});
function refreshPlanChoice() {
  const wrap = document.getElementById("plan-wrap");
  const n = newSlipDraft.count;
  const eligible = !!n && n >= NOMI_MIN_PEOPLE;
  wrap.style.display = eligible ? "" : "none";
  document.querySelectorAll("#plan-choice .choice-btn").forEach(b => {
    b.classList.toggle("selected", b.dataset.val === newSlipDraft.plan);
  });
  const note = document.getElementById("plan-note");
  if (eligible) {
    if (newSlipDraft.plan === "nomi") {
      note.innerHTML = `飲み放題 <b>${n}名 × ${yen(NOMI_PER_PERSON)} = ${yen(n * NOMI_PER_PERSON)}</b>(2時間・チャージなし)<br>`
        + `<span style="color:var(--text-muted);">延長は1時間ごとに1人 ${yen(NOMI_EXTEND_PER_PERSON)}。時間のスタートは伝票を作ったあとに押します。</span>`;
    } else if (newSlipDraft.plan === "normal") {
      note.innerHTML = `チャージ <b>${n}名 × ${yen(CHARGE_PER_PERSON)} = ${yen(n * CHARGE_PER_PERSON)}</b>(いつも通りの伝票)`;
    } else {
      note.innerHTML = `<span style="color:var(--danger); font-weight:600;">${NOMI_MIN_PEOPLE}名以上なので、どちらのプランか選んでください。</span>`;
    }
  }
  updateCreateBtn();
}
function updateCreateBtn() {
  document.getElementById("new-create-btn").disabled = !(newSlipDraft.type && newSlipDraft.count && newSlipDraft.plan);
}

document.getElementById("new-create-btn").addEventListener("click", () => {
  const slip = {
    id: nextSlipId++,
    table: currentTable,
    type: newSlipDraft.type,
    count: newSlipDraft.count,
    note: document.getElementById("note-input").value.trim(),
    items: [],
    status: "open",
    createdAt: new Date().toISOString()
  };
  // 飲み放題を選んでいたら、その場でプランをつけておく
  if (newSlipDraft.plan === "nomi") {
    slip.nomihodai = { count: slip.count, startAt: null, extends: 0 };
  }
  slips.push(slip);
  currentSlipId = slip.id;
  activeItemTab = "liquor";
  showView("slip");
  renderSlipView();
  saveData();
});

// ---- 合計計算 ----
function itemExtra(item) {
  let extra = 0;
  if (item.mods && item.mods.mixer) extra += item.mods.mixer;
  return extra;
}

// ---- 飲み放題プランの計算 ----
function nomiPlan(slip) { return (slip && slip.nomihodai) ? slip.nomihodai : null; }
// 飲み放題のときはチャージをもらわない(飲み放題料金に含まれているため)
function chargeFor(slip) { return nomiPlan(slip) ? 0 : (slip.count || 0) * CHARGE_PER_PERSON; }
function nomiBaseFee(slip) {
  const n = nomiPlan(slip);
  return n ? n.count * NOMI_PER_PERSON : 0;
}
function nomiExtendFee(slip) {
  const n = nomiPlan(slip);
  return n ? (n.extends || 0) * n.count * NOMI_EXTEND_PER_PERSON : 0;
}
function nomiFee(slip) { return nomiBaseFee(slip) + nomiExtendFee(slip); }

// 飲み放題の時間割り。開始していなければ null
function nomiTiming(slip) {
  const n = nomiPlan(slip);
  if (!n || !n.startAt) return null;
  const start = new Date(n.startAt).getTime();
  if (isNaN(start)) return null;
  const totalMin = NOMI_PLAN_MINUTES + (n.extends || 0) * NOMI_EXTEND_MINUTES;
  const elapsed = Math.floor((Date.now() - start) / 60000);
  return {
    start,
    totalMin,
    elapsed,
    endAt: start + totalMin * 60000,
    loAt: start + (totalMin - NOMI_LO_BEFORE_END) * 60000,
    stopAt: start + (totalMin - NOMI_ORDER_STOP_BEFORE_END) * 60000,
    remainMin: totalMin - elapsed,
    loPassed: elapsed >= totalMin - NOMI_LO_BEFORE_END,
    orderClosed: elapsed >= totalMin - NOMI_ORDER_STOP_BEFORE_END
  };
}
// 飲み放題の注文を今つけられるか
function nomiCanOrder(slip) {
  const n = nomiPlan(slip);
  if (!n) return false;
  const t = nomiTiming(slip);
  if (!t) return true;       // まだスタートを押していないうちは追加できる
  return !t.orderClosed;
}

function calcTotal(slip) {
  const itemsTotal = slip.items.filter(i => !i.cancelled).reduce((s,i) => s + i.price + itemExtra(i), 0);
  return chargeFor(slip) + nomiFee(slip) + itemsTotal;
}

// ---- 伝票エディタ ----
function getCurrentSlip() { return slips.find(s => s.id === currentSlipId); }

function renderSlipView() {
  const slip = getCurrentSlip();
  const el = document.getElementById("view-slip");
  if (!slip) { el.innerHTML = ""; return; }
  const total = calcTotal(slip);
  const charge = chargeFor(slip);
  const isPaid = slip.status === "paid";
  const nomi = nomiPlan(slip);

  el.innerHTML = `
    ${renderTableSwitch(slip.table)}

    <div class="slip-header">
      <div>
        <div class="slip-title">${slip.table} 卓</div>
        <div class="slip-meta"><b>${escapeHtml(slip.type)}</b> ・ <b>${slip.count}名</b> ・ ${nomi ? `飲み放題 <b>${nomi.count}名</b>(チャージなし)` : `チャージ ${yen(charge)}`}${slip.note ? " ・ " + escapeHtml(slip.note) : ""}</div>
      </div>
      ${isPaid ? `<span class="paid-badge">お会計済(${escapeHtml(slip.payment ? (slip.payment.method + (slip.payment.note ? ':' + slip.payment.note : '')) : '')})</span>` : ''}
    </div>

    <div class="total-box">
      <span class="label">合計金額</span>
      <span class="amount">${yen(total)}</span>
    </div>

    <div id="nomi-panel">${renderNomiPanel(slip, isPaid)}</div>

    ${(!isPaid && !nomi) ? `<div style="margin-bottom:18px;"><button class="btn-primary" style="width:100%" onclick="openItemPicker()">＋ 追加</button></div>` : ''}

    <h2 style="font-size:14px; margin:0 0 10px;">注文内容</h2>
    <div id="order-list">${renderOrderList(slip, isPaid)}</div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn-ghost" onclick="backToTables()">卓一覧に戻る</button>
      ${isPaid ? '<button class="btn-paid" disabled>お会計済</button>' : (payUiOpen ? '' : '<button class="btn-paid" onclick="startPayment()">お会計</button>')}
    </div>

    ${(!isPaid && payUiOpen) ? renderPayBox() : ''}
  `;
}

// ================= 飲み放題プラン =================
function fmtClock(ms) {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtMin(min) {
  const m = Math.max(0, Math.round(min));
  if (m < 60) return `${m}分`;
  return `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}`;
}

let nomiSetupOpen = false;
let nomiSetupCount = null;

function openNomiSetup() {
  const slip = getCurrentSlip();
  nomiSetupOpen = true;
  const cur = nomiPlan(slip);
  nomiSetupCount = cur ? cur.count : (slip.count >= NOMI_MIN_PEOPLE ? slip.count : NOMI_MIN_PEOPLE);
  renderSlipView();
}
// 人数の入力に合わせて金額の目安とボタンだけ書き換える(画面全体は作り直さない)
function onNomiCountInput(v) {
  const n = parseInt(v, 10);
  nomiSetupCount = (n >= NOMI_MIN_PEOPLE) ? n : null;
  const line = document.getElementById("nomi-fee-preview");
  if (line) {
    line.innerHTML = nomiSetupCount
      ? `飲み放題料金 <b>${nomiSetupCount} 名 × ${yen(NOMI_PER_PERSON)} = ${yen(nomiSetupCount * NOMI_PER_PERSON)}</b>`
      : `<span style="color:var(--danger); font-weight:600;">${NOMI_MIN_PEOPLE}名以上を入れてください</span>`;
  }
  const btn = document.getElementById("nomi-save-btn");
  if (btn) btn.disabled = !nomiSetupCount;
}
function closeNomiSetup() { nomiSetupOpen = false; renderSlipView(); }
function saveNomiPlan() {
  const slip = getCurrentSlip();
  if (!nomiSetupCount) return;
  if (slip.nomihodai) {
    slip.nomihodai.count = nomiSetupCount;
  } else {
    slip.nomihodai = { count: nomiSetupCount, startAt: null, extends: 0 };
  }
  nomiSetupOpen = false;
  renderSlipView();
  renderTableGrid();
  saveData();
}
function startNomiClock() {
  const slip = getCurrentSlip();
  const n = nomiPlan(slip);
  if (!n) return;
  n.startAt = new Date().toISOString();
  renderSlipView();
  renderTableGrid();
  saveData();
}
function editNomiStart() {
  const slip = getCurrentSlip();
  const n = nomiPlan(slip);
  if (!n) return;
  const base = n.startAt ? new Date(n.startAt) : new Date();
  const cur = `${String(base.getHours()).padStart(2,"0")}:${String(base.getMinutes()).padStart(2,"0")}`;
  const input = prompt("スタート時間を入力してください(24時間表記、例 20:15)", cur);
  if (input === null) return;
  const m = String(input).trim().match(/^(\d{1,2})[:：](\d{1,2})$/);
  if (!m) { alert("時間の形式が違います。20:15 のように入力してください。"); return; }
  const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
  if (h > 23 || mi > 59) { alert("時間の形式が違います。20:15 のように入力してください。"); return; }
  const d = new Date();
  d.setHours(h, mi, 0, 0);
  // 深夜営業で「日付が変わったのに今より先の時間」を入れた場合は前日として扱う
  if (d.getTime() - Date.now() > 6 * 3600 * 1000) d.setDate(d.getDate() - 1);
  n.startAt = d.toISOString();
  renderSlipView();
  renderTableGrid();
  saveData();
}
function extendNomi(delta) {
  const slip = getCurrentSlip();
  const n = nomiPlan(slip);
  if (!n) return;
  const next = Math.max(0, (n.extends || 0) + delta);
  if (next > 12) return;
  n.extends = next;
  renderSlipView();
  renderTableGrid();
  saveData();
}

function renderNomiPanel(slip, isPaid) {
  const n = nomiPlan(slip);
  // 通常プランの伝票には飲み放題の欄を出さない(プランは伝票を作るときに決める)
  if (!n) return "";

  // --- 人数を変更している最中 ---
  if (nomiSetupOpen && !isPaid) {
    return `
      <div class="panel nomi-panel" style="margin-bottom:18px;">
        <h2>🍻 飲み放題プラン の人数を変更</h2>
        <div class="nomi-note">1人 ${yen(NOMI_PER_PERSON)}(2時間)・延長1時間ごとに1人 ${yen(NOMI_EXTEND_PER_PERSON)}・チャージなし</div>
        ${slip.count < NOMI_MIN_PEOPLE ? `<div class="nomi-warn">この伝票は${slip.count}名です。飲み放題は${NOMI_MIN_PEOPLE}名様からのプランです。</div>` : ''}

        <input type="number" id="nomi-count-input" min="${NOMI_MIN_PEOPLE}" value="${nomiSetupCount || ''}"
               placeholder="例: 12" oninput="onNomiCountInput(this.value)" style="max-width:160px;">
        <div class="nomi-fee-line" id="nomi-fee-preview">${nomiSetupCount
          ? `飲み放題料金 <b>${nomiSetupCount} 名 × ${yen(NOMI_PER_PERSON)} = ${yen(nomiSetupCount * NOMI_PER_PERSON)}</b>`
          : `<span style="color:var(--danger); font-weight:600;">${NOMI_MIN_PEOPLE}名以上を入れてください</span>`}</div>
        <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
          <button class="btn-ghost" onclick="closeNomiSetup()">やめる</button>
          <button class="btn-primary" id="nomi-save-btn" ${nomiSetupCount ? '' : 'disabled'} onclick="saveNomiPlan()">人数を変更する</button>
        </div>
      </div>
    `;
  }

  // --- 通常表示 ---
  const t = nomiTiming(slip);
  const canOrder = nomiCanOrder(slip);
  return `
    <div class="panel nomi-panel" style="margin-bottom:18px;">
      <h2>🍻 飲み放題プラン ${n.count}名</h2>

      <div class="nomi-fee-line">
        飲み放題料金 <b>${n.count}名 × ${yen(NOMI_PER_PERSON)} = ${yen(nomiBaseFee(slip))}</b>
        ${n.extends ? `<br>延長 <b>${n.extends}時間 × ${n.count}名 × ${yen(NOMI_EXTEND_PER_PERSON)} = ${yen(nomiExtendFee(slip))}</b>` : ''}
        <br>飲み放題の小計 <b>${yen(nomiFee(slip))}</b>
      </div>

      <div id="nomi-time-box">${renderNomiTimeBox(slip)}</div>

      ${!isPaid ? `
        <button class="btn-primary" id="nomi-add-btn" style="width:100%; margin-top:14px;" ${canOrder ? '' : 'disabled'} onclick="openNomiPicker()">
          ＋ 飲み放題の注文を追加(0円)
        </button>
        <div class="nomi-note" style="margin-top:6px;">${NOMI_PRICE_LIMIT}円以下のお酒・ソフトドリンク／割材は＋100円のものが対象です</div>

        <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:14px;">

function renderNomiTimeBox(slip) {
  const n = nomiPlan(slip);
  if (!n) return "";
  const t = nomiTiming(slip);
  const isPaid = slip.status === "paid";

  if (!t) {
    return `
      <div class="nomi-time nomi-time-idle">
        <div class="nomi-time-main">スタート前</div>
        <div class="nomi-note">お客様に提供を始めたらボタンを押してください(2時間の計測が始まります)</div>
      </div>
      ${!isPaid ? `<button class="btn-primary" style="width:100%; margin-top:10px; background:#e8940c;" onclick="startNomiClock()">▶ スタート</button>` : ''}
    `;
  }

  const state = t.remainMin <= 0 ? "over" : (t.loPassed ? "lo" : "ok");
  const remainText = t.remainMin > 0 ? `残り ${fmtMin(t.remainMin)}` : `終了時間を ${fmtMin(-t.remainMin)} 過ぎています`;
  const loText = t.orderClosed
    ? "ラストオーダー終了(注文の受付を締め切りました)"
    : (t.loPassed
        ? `ラストオーダー中 ${fmtClock(t.stopAt)} まで受付`
        : `ラストオーダー ${fmtClock(t.loAt)}(あと ${fmtMin((t.loAt - Date.now()) / 60000)})`);

  return `
    <div class="nomi-time nomi-time-${state}">
      <div class="nomi-time-main">${remainText}</div>
      <div class="nomi-time-sub">開始 ${fmtClock(t.start)} → 終了予定 ${fmtClock(t.endAt)}${n.extends ? `(${NOMI_PLAN_MINUTES / 60}時間＋延長${n.extends}時間)` : "(2時間)"}</div>
      <div class="nomi-time-sub">${loText}</div>
    </div>
    ${!isPaid ? `
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
        <button class="btn-ghost" onclick="editNomiStart()">開始時間を修正</button>
        <button class="btn-primary" style="background:#1baf7a;" onclick="extendNomi(1)">＋1時間延長(＋${yen(n.count * NOMI_EXTEND_PER_PERSON)})</button>
        ${n.extends ? `<button class="btn-danger-outline" onclick="extendNomi(-1)">延長を1時間戻す</button>` : ''}
      </div>
    ` : ''}
  `;
}

// ---- 品目タップ ----
function onItemTap(id, cat) {
  if (cat === "dish" || cat === "bottle") {
    stageOrderItem(id, cat, null);
    return;
  }
  // ビール・ワイン・ソフトドリンク・ホットドリンクは割材も飲み方もないのでそのまま追加
  const src = menu.liquors.find(x => x.id === id);
  if (src && NO_MODS_CATEGORIES.includes(src.category)) {
    stageOrderItem(id, cat, null);
    return;
  }
  // それ以外のお酒 -> 飲み方モーダル(モーダルの上にさらに開く)
  openModifierModal(id);
}

// ---- 個数(qty)つきで一時リストに入れる。同じ品目・同じ飲み方ならまとめる ----
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

// この品目が今いくつ一時リストに入っているか(タイルに出す用)
function stagedCountFor(name, cat) {
  return stagedItems.filter(x => x.name === name && x.cat === cat)
                    .reduce((n, x) => n + (x.qty || 1), 0);
}

function stagedKey(i) {
  return [i.name, i.cat, i.price, JSON.stringify(i.mods || null), i.custom ? 1 : 0, i.nomi ? 1 : 0].join("|");
}
function addStaged(entry, qty) {
  const n = Math.max(1, qty || 1);
  const key = stagedKey(entry);
  const hit = stagedItems.find(x => stagedKey(x) === key);
  if (hit) { hit.qty = (hit.qty || 1) + n; return; }
  stagedItems.push({ ...entry, qty: n });
}
function stagedStep(idx, delta) {
  const it = stagedItems[idx];
  if (!it) return;
  const next = (it.qty || 1) + delta;
  if (next <= 0) { stagedItems.splice(idx, 1); } else { it.qty = Math.min(99, next); }
  renderItemPicker();
}

function stageOrderItem(id, cat, mods) {
  let source;
  if (cat === "dish") { source = menu.dishes.find(x => x.id === id); }
  else if (cat === "bottle") { source = menu.bottles.find(x => x.id === id); }
  else { source = menu.liquors.find(x => x.id === id); }
  if (!source) return;
  const isNomi = pickerMode === "nomi";
  const price = isNomi ? 0 : (cat === "liquor" ? source.sellPrice : source.price);
  const entry = { id: nextItemId++, name: source.name, cat, price, mods: mods || null, cancelled: false, orderedAt: new Date().toISOString() };
  if (isNomi) entry.nomi = true;
  addStaged(entry, 1);
  const modLabel = mods && (mods.style || mods.mixer || mods.mixerName) ? `(${[mixerLabel(mods), mods.style || ""].filter(Boolean).join(" / ")})` : "";
  showToast(`${source.name}${modLabel} を追加しました${isNomi ? "(飲み放題)" : ""}`);
  renderItemPicker();
}

  { key: "mix100", label: "割材(+100)", mixer: 100, style: null },
  { key: "mix200", label: "割材(+200)", mixer: 200, style: null }
];
let modalState = { choiceKey: null, mixerName: null };
// 飲み放題のときは「＋200円の割材」は選べない
function drinkStyleOptions() {
  return pickerMode === "nomi"
    ? DRINK_STYLE_OPTIONS.filter(o => o.mixer !== 200)

// 割材はソフトドリンクと同じもの。+100円 → 600円のソフトドリンク、+200円 → 800円のソフトドリンク
const MIXER_PRICE_BY_EXTRA = { 100: 600, 200: 800 };
function mixerOptions(extra) {
  const price = MIXER_PRICE_BY_EXTRA[extra];
  return (menu.liquors || [])
    .filter(l => l.category === "ソフトドリンク" && (l.sellPrice || 0) === price)
    .slice()
    .sort((a, b) => JA_COLLATOR.compare(a.name || "", b.name || ""));
}
// 値段(600/800円)から割材の追加料金(+100/+200)を逆引き
const MIXER_EXTRA_BY_PRICE = { 600: 100, 800: 200 };
// 割材だけを注文する用の一覧(ボトルを入れたお客様向け)。+100 → +200 の順、同額なら五十音順
function mixerOnlyList() {
  return (menu.liquors || [])
    .filter(l => l.category === "ソフトドリンク" && MIXER_EXTRA_BY_PRICE[l.sellPrice || 0])
    .map(l => ({ ...l, extra: MIXER_EXTRA_BY_PRICE[l.sellPrice] }))
    .sort((a, b) => (a.extra - b.extra) || JA_COLLATOR.compare(a.name || "", b.name || ""));
}
function mixerOnlyName(name) { return `${name}(割材)`; }
function addMixerOnly(id) {
  const m = mixerOnlyList().find(x => x.id === id);
  if (!m) return;
  addStaged({
    id: nextItemId++, name: mixerOnlyName(m.name), cat: "liquor", price: m.extra,
    mods: null, mixerOnly: true, cancelled: false, orderedAt: new Date().toISOString()
  }, 1);
  showToast(`${mixerOnlyName(m.name)} を追加しました`);
  renderItemPicker();
}

// 注文一覧などに出す文字(例: 割材+100(コーラ))
function mixerLabel(mods) {
  if (!mods) return "";
  // 飲み放題は追加料金なしなので「割材(コーラ)」だけを出す
  if (!mods.mixer) return mods.mixerName ? `割材(${mods.mixerName})` : "";
  return `割材+${mods.mixer}${mods.mixerName ? `(${mods.mixerName})` : ""}`;
}
function openModifierModal(liquorId) {
  modalState = { choiceKey: null };
  const liquor = menu.liquors.find(x => x.id === liquorId);
  const modal = document.getElementById("modifier-modal");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="closeModifierModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>${escapeHtml(liquor.name)} の飲み方(必須・いずれか1つ)${pickerMode === "nomi" ? '<span class="nomi-tag">飲み放題 0円</span>' : ''}</h3>
        <div class="choice-row" id="style-choice-row">
          ${drinkStyleOptions().map(o => `<div class="choice-btn" id="style-opt-${o.key}" onclick="pickDrinkStyle('${o.key}')">${pickerMode === "nomi" && o.mixer ? "割材" : o.label}</div>`).join("")}
        </div>
        <div id="mixer-wrap" style="display:none; margin-top:6px;">
          <label>割材を選んでください(必須)</label>
          <div class="choice-row" id="mixer-choice-row"></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn-ghost" onclick="closeModifierModal()">キャンセル</button>
          <button class="btn-primary" id="liquor-confirm-btn" disabled onclick="confirmAddLiquor(${liquorId})">この内容で追加</button>
        </div>
      </div>
    </div>
  `;
}
function pickDrinkStyle(key) {
  modalState.choiceKey = key;
  modalState.mixerName = null;
  drinkStyleOptions().forEach(o => {
    const el = document.getElementById(`style-opt-${o.key}`);
    if (el) el.classList.toggle("selected", o.key === key);
  });
  const opt = DRINK_STYLE_OPTIONS.find(o => o.key === key);
  const wrap = document.getElementById("mixer-wrap");
  const row = document.getElementById("mixer-choice-row");
  const btn = document.getElementById("liquor-confirm-btn");
  if (opt && opt.mixer) {
    const list = mixerOptions(opt.mixer);
    wrap.style.display = "";
    if (list.length === 0) {
      row.innerHTML = `<div class="empty-msg" style="padding:6px 0;">値段確認アプリに${MIXER_PRICE_BY_EXTRA[opt.mixer]}円のソフトドリンクが登録されていません</div>`;
      btn.disabled = false; // 登録がないときは割材の指定なしで追加できる
    } else {
      row.innerHTML = list.map(m => `<div class="choice-btn" id="mixer-opt-${m.id}" onclick="pickMixer(${m.id})">${escapeHtml(m.name)}</div>`).join("");
      btn.disabled = true;  // 割材を選ぶまでは押せない
    }
  } else {
    wrap.style.display = "none";
    row.innerHTML = "";
    btn.disabled = false;
  }
}

function pickMixer(id) {
  const opt = DRINK_STYLE_OPTIONS.find(o => o.key === modalState.choiceKey);
  if (!opt) return;
  const list = mixerOptions(opt.mixer);
  const picked = list.find(m => m.id === id);
  if (!picked) return;
  modalState.mixerName = picked.name;
  list.forEach(m => {
    const el = document.getElementById(`mixer-opt-${m.id}`);
    if (el) el.classList.toggle("selected", m.id === id);
  });
  document.getElementById("liquor-confirm-btn").disabled = false;
}
function closeModifierModal(e) {
  document.getElementById("modifier-modal").innerHTML = "";
}
function confirmAddLiquor(liquorId) {
  if (!modalState.choiceKey) return;
  const opt = DRINK_STYLE_OPTIONS.find(o => o.key === modalState.choiceKey);
  // 飲み放題のときは割材の追加料金をとらない(0円のまま)
  const mixer = pickerMode === "nomi" ? 0 : opt.mixer;
  stageOrderItem(liquorId, "liquor", { mixer, style: opt.style, mixerName: modalState.mixerName || null });
  closeModifierModal();
}

// ---- おすすめカクテル・シェイクカクテル(800円〜1500円を選択) ----
// ---- ショット / 季節のカクテル(割材なし・数量をプラス/マイナスで指定) ----
// kind: "shot" = menu.shots, "seasonal" = menu.cocktails(値段確認アプリの「季節のカクテル」)
const QTY_PICKERS = {
  shot:     { label: "ショット",      list: () => menu.shots || [],     cat: "shot",  empty: "値段確認アプリの「ショット」タブでまだ登録がありません" },
  seasonal: { label: "季節のカクテル", list: () => menu.cocktails || [], cat: "cocktail",  empty: "値段確認アプリの「季節のカクテル」タブでまだ登録がありません" }
};
let qtyPickKind = "shot";
let qtyPickQty = {};

function qtyPickList() {
  // 値段の安い順 → 同じ値段なら五十音順
  return QTY_PICKERS[qtyPickKind].list().slice().sort((a, b) => {
    const d = (a.price || 0) - (b.price || 0);
    if (d !== 0) return d;
    return JA_COLLATOR.compare(a.name || "", b.name || "");
  });
}
function qtyPickCount() { return Object.values(qtyPickQty).reduce((s, n) => s + n, 0); }
function qtyPickYen() { return qtyPickList().reduce((s, it) => s + (qtyPickQty[it.id] || 0) * it.price, 0); }

function openShotModal() { openQtyPicker("shot"); }
function openSeasonalModal() { openQtyPicker("seasonal"); }
function openQtyPicker(kind) {
  qtyPickKind = kind;
  qtyPickQty = {};
  renderQtyPicker();
}
function qtyPickStep(id, delta) {
  const cur = qtyPickQty[id] || 0;
  const next = Math.max(0, Math.min(99, cur + delta));
  if (next === 0) { delete qtyPickQty[id]; } else { qtyPickQty[id] = next; }
  // 画面全体を作り直すとスクロールが先頭に戻ってしまうので、変わったところだけ書き換える
  const row = document.getElementById(`qp-row-${id}`);
  if (!row) { renderQtyPicker(); return; }
  row.classList.toggle("picked", next > 0);
  const num = document.getElementById(`qp-num-${id}`);
  if (num) num.textContent = next;
  const minus = document.getElementById(`qp-minus-${id}`);
  if (minus) minus.disabled = (next === 0);
  const total = document.getElementById("qp-total");
  if (total) total.textContent = `小計 ${yen(qtyPickYen())}`;
  const btn = document.getElementById("shot-confirm-btn");
  if (btn) { btn.disabled = qtyPickCount() === 0; btn.textContent = `追加(${qtyPickCount()}点)`; }
}
function renderQtyPicker() {
  const conf = QTY_PICKERS[qtyPickKind];
  const list = qtyPickList();
  const modal = document.getElementById("modifier-modal");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="closeModifierModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()" style="max-width:520px; max-height:85vh; overflow-y:auto;">
        <h3>${escapeHtml(conf.label)}(数量を選んでください)</h3>
        ${list.length === 0
          ? `<div class="empty-msg">${conf.empty}</div>`
          : list.map(it => {
              const n = qtyPickQty[it.id] || 0;
              return `
                <div class="qty-row ${n > 0 ? 'picked' : ''}" id="qp-row-${it.id}">
                  <div class="qty-info">
                    <span class="qty-name">${escapeHtml(it.name)}</span>
                    <span class="qty-price">${yen(it.price)}</span>
                  </div>
                  <div class="qty-ctrl">
                    <button id="qp-minus-${it.id}" onclick="qtyPickStep(${it.id}, -1)" ${n === 0 ? 'disabled' : ''}>−</button>
                    <span class="qty-num" id="qp-num-${it.id}">${n}</span>
                    <button onclick="qtyPickStep(${it.id}, 1)">＋</button>
                  </div>
                </div>
              `;
            }).join("")
        }
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; flex-wrap:wrap; gap:10px;">
          <b id="qp-total">小計 ${yen(qtyPickYen())}</b>
          <div style="display:flex; gap:10px;">
            <button class="btn-ghost" onclick="closeModifierModal()">キャンセル</button>
            <button class="btn-primary" id="shot-confirm-btn" ${qtyPickCount() === 0 ? 'disabled' : ''} onclick="confirmQtyPick()">追加(${qtyPickCount()}点)</button>
          </div>
        </div>
      </div>
    </div>
  `;
}
function confirmQtyPick() {
  if (qtyPickCount() === 0) return;
  const conf = QTY_PICKERS[qtyPickKind];
  qtyPickList().forEach(it => {
    const n = qtyPickQty[it.id] || 0;
    if (n > 0) {
      addStaged({
        id: nextItemId++, name: it.name, cat: conf.cat, price: it.price,
        mods: null, cancelled: false, orderedAt: new Date().toISOString()
      }, n);
    }
  });
  qtyPickQty = {};
  closeModifierModal();
  renderItemPicker();
}

function openCocktailModal(kind) {
  const label = kind === 'recommend' ? 'おすすめカクテル' : 'シェイクカクテル';
  modalState = { cocktailPrice: null };
  const modal = document.getElementById("modifier-modal");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="closeModifierModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>${escapeHtml(label)}の金額を選択(必須)</h3>
        <div class="choice-row" id="cocktail-price-row">
          ${COCKTAIL_PRICE_OPTIONS.map(p => `<div class="choice-btn" id="cocktail-opt-${p}" onclick="pickCocktailPrice(${p})">${yen(p)}</div>`).join("")}
        </div>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn-ghost" onclick="closeModifierModal()">キャンセル</button>
          <button class="btn-primary" id="cocktail-confirm-btn" disabled onclick="confirmCocktail('${label}')">この内容で追加</button>
        </div>
      </div>
    </div>
  `;
}
function pickCocktailPrice(p) {
  modalState.cocktailPrice = p;
  COCKTAIL_PRICE_OPTIONS.forEach(o => {
    document.getElementById(`cocktail-opt-${o}`).classList.toggle("selected", o === p);
  });
  document.getElementById("cocktail-confirm-btn").disabled = false;
}
function confirmCocktail(label) {
  if (!modalState.cocktailPrice) return;
  addStaged({ id: nextItemId++, name: label, cat: "cocktail", price: modalState.cocktailPrice, mods: null, cancelled: false, orderedAt: new Date().toISOString() }, 1);
  closeModifierModal();
  renderItemPicker();
}

// ---- 複雑な注文(自由入力) ----
let customMixerExtra = 0; // 割材の追加金額(0 / 100 / 200)
let customMixerOpen = false;

function openCustomModal() {
  const catLabel = activeItemTab === 'liquor' ? 'お酒' : 'おつまみ・料理';
  customMixerExtra = 0;
  customMixerOpen = false;
  const modal = document.getElementById("modifier-modal");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="closeModifierModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>複雑な注文(${catLabel})</h3>
        <label>注文内容</label>
        <div style="margin-bottom:14px;"><input type="text" id="custom-desc-input" placeholder="例: 白ワインをロックで、多めに"></div>
        <label>金額(円)</label>
        <div style="margin-bottom:14px;"><input type="number" id="custom-price-input" placeholder="例: 900"></div>
        <div style="margin-bottom:14px;">
          <button type="button" class="btn-ghost" id="mixer-toggle-btn" onclick="toggleMixerOptions()">割材</button>
          <div id="mixer-options" style="display:none; margin-top:8px; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn-ghost mixer-opt-btn" data-extra="100" onclick="selectMixerExtra(100)">＋100円</button>
            <button type="button" class="btn-ghost mixer-opt-btn" data-extra="200" onclick="selectMixerExtra(200)">＋200円</button>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-ghost" onclick="closeModifierModal()">キャンセル</button>
          <button class="btn-primary" onclick="confirmCustomOrder()">この内容で追加</button>
        </div>
      </div>
    </div>
  `;
}
function toggleMixerOptions() {
  customMixerOpen = !customMixerOpen;
  const box = document.getElementById("mixer-options");
  box.style.display = customMixerOpen ? "flex" : "none";
}
function selectMixerExtra(amount) {
  customMixerExtra = (customMixerExtra === amount) ? 0 : amount; // もう一度押すと選択解除
  document.querySelectorAll(".mixer-opt-btn").forEach(btn => {
    const isSelected = parseInt(btn.dataset.extra, 10) === customMixerExtra;
    btn.classList.toggle("active", isSelected);
  });
}
function confirmCustomOrder() {
  const desc = document.getElementById("custom-desc-input").value.trim();
  const basePrice = parseFloat(document.getElementById("custom-price-input").value);
  if (!desc || !basePrice) { return; }
  const price = basePrice + (customMixerExtra || 0);
  const name = customMixerExtra ? `${desc}(割材+${customMixerExtra}円)` : desc;
  addStaged({ id: nextItemId++, name, cat: activeItemTab === 'liquor' ? 'liquor' : 'dish', price, mods: null, custom: true, cancelled: false, orderedAt: new Date().toISOString() }, 1);
  closeModifierModal();
  renderItemPicker();
}

document.getElementById("refresh-btn").addEventListener("click", () => { loadData(); });
loadData();
</script>
